# This workflow will publish a .NET project to NuGet
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Publish to NuGet

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]
    paths:
      - src/DotnetSlnSync/DotnetSlnSync.csproj
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-release:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.evaluate.outputs.should_publish }}
      version: ${{ steps.evaluate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate release conditions
        id: evaluate
        shell: bash
        run: |
          PROJECT_FILE="src/DotnetSlnSync/DotnetSlnSync.csproj"

          VERSION=$(grep -oP '<Version>\K[^<]+' "$PROJECT_FILE" || true)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from $PROJECT_FILE."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run requested."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "PR was not merged. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_VERSION=$(git show "${{ github.event.pull_request.base.sha }}:$PROJECT_FILE" | grep -oP '<Version>\K[^<]+' || true)
          HEAD_VERSION=$(git show "${{ github.event.pull_request.head.sha }}:$PROJECT_FILE" | grep -oP '<Version>\K[^<]+' || true)

          if [ -z "$BASE_VERSION" ] || [ -z "$HEAD_VERSION" ]; then
            echo "::error::Could not extract version from PR base/head commits."
            exit 1
          fi

          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "Version is unchanged ($HEAD_VERSION). Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version changed from $BASE_VERSION to $HEAD_VERSION."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$HEAD_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: evaluate-release
    if: needs.evaluate-release.outputs.should_publish == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore ./dotnet-sln-sync.slnx
      - name: Build
        run: dotnet build ./dotnet-sln-sync.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test ./dotnet-sln-sync.slnx --no-build --configuration Release --verbosity normal
      - name: Pack
        run: dotnet pack ./dotnet-sln-sync.slnx --no-build --configuration Release --output ./nupkg
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkg/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.evaluate-release.outputs.version }}"
          gh release create "v$VERSION" ./nupkg/*.nupkg \
            --title "v$VERSION" \
            --generate-notes

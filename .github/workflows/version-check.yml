# This workflow checks that the version in the .csproj file has been updated in a PR
name: Version Check

on:
  pull_request

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check version update
      run: |
        BASE_REF="${{ github.event.pull_request.base.ref }}"
        git fetch origin "$BASE_REF"

        BASE_VERSION=$(git show "origin/$BASE_REF:src/SolutionSync/dotnet-sln-sync.csproj" | grep -oP '<Version>\K[^<]+' || true)
        PR_VERSION=$(grep -oP '<Version>\K[^<]+' src/SolutionSync/dotnet-sln-sync.csproj || true)

        if [ -z "$BASE_VERSION" ]; then
          echo "::warning::Could not extract version from base branch. Skipping version check."
          exit 0
        fi

        if [ -z "$PR_VERSION" ]; then
          echo "::error::Could not extract version from PR branch. Ensure <Version> is set in src/SolutionSync/dotnet-sln-sync.csproj."
          exit 1
        fi

        echo "Base version: $BASE_VERSION"
        echo "PR version:   $PR_VERSION"

        if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
          echo "::error::Version in src/SolutionSync/dotnet-sln-sync.csproj has not been updated. Please bump the version."
          exit 1
        fi

        echo "Version has been updated from $BASE_VERSION to $PR_VERSION."
